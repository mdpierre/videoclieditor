[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-cli-toolkit"
version = "0.1.0"
description = "Local Apple Silicon video workflow for transcription, rough cuts, and captions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Michael Pierre" }]
dependencies = []

[project.scripts]
toolkit = "video_cli_toolkit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

